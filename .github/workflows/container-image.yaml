name: Container Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "*"

# Multi-arch image built with one native runner per platform (amd64 and arm64),
# no QEMU emulation. The reusable workflow pushes each platform by digest and
# publishes the merged manifest.
jobs:
  build-and-push-image:
    name: Build and push container image
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
      cache: true
      cache-mode: max
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
