[package]
name = "www-redirector"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = "0.8"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
